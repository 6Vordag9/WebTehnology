<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Вход в личный кабинет Food FRYDAY — отслеживайте статус заказа и историю доставок.">
    <title>Food FRYDAY — Авторизация</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <div class="container">
                <h1>Food FRYDAY</h1>
                <nav class="main-nav">
                    <a href="index.html">О нас</a>
                    <a href="order.html">Сделать заказ</a>
                    <a href="index.html#contacts">Контакты</a>
                    <a href="auth.html" class="active">Авторизация</a>
                    <a href="feedback.html">Обратная связь</a>
                </nav>
            </div>
        </header>

        <main class="container form-page">
            <div class="auth-form">
                <h2>Вход в систему</h2>
                <form action="https://httpbin.org/post" method="POST">
                    <div class="form-group">
                        <label for="login">Логин</label>
                        <input type="text" id="login" name="login" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember" name="remember" value="on">
                            <label for="remember">Запомнить меня</label>
                        </div>
                    </div>

                    <button type="submit">Войти</button>
                </form>

                <div class="nav-links">
                    <a href="index.html">Главная</a>
                    <a href="feedback.html">Обратная связь</a>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
            </div>
        </footer>
    </div>
</body>
</html>
