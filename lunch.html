<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Соберите свой идеальный ланч из супов, горячих блюд и напитков Food FRYDAY.">
  <title>Food FRYDAY — Собрать ланч</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lunch.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <div class="container">
        <h1>Food FRYDAY</h1>
        <nav class="main-nav">
          <a href="index.html">О нас</a>
          <a href="lunch.html" class="active">Собрать заказ</a>
          <a href="#orders">Заказы</a>
          <a href="#contacts">Контакты</a>
          <a href="auth.html">Авторизация</a>
          <a href="feedback.html">Обратная связь</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2 class="page-title">Собрать ланч</h2>

      <section class="menu-section">
        <h2>Супы</h2>
        <div class="dishes-grid">
          <div class="dish-card">
            <img src="image2.jpg" 
                 alt="Томатный суп с базиликом" width="400" height="300" loading="lazy">
            <p class="dish-price">320₽</p>
            <p class="dish-name">Томатный суп с базиликом</p>
            <p class="dish-weight">300 мл</p>
            <button type="button">Добавить</button>
          </div>

          <div class="dish-card">
            <img src="image3.jpg" 
                 alt="Крем-суп из грибов" width="400" height="300" loading="lazy">
            <p class="dish-price">350₽</p>
            <p class="dish-name">Крем-суп из белых грибов</p>
            <p class="dish-weight">300 мл</p>
            <button type="button">Добавить</button>
          </div>

          <div class="dish-card">
            <img src="image4.jpg" 
                 alt="Куриный суп с лапшой" width="300" height="300" loading="lazy">
            <p class="dish-price">290₽</p>
            <p class="dish-name">Куриный суп с домашней лапшой</p>
            <p class="dish-weight">350 мл</p>
            <button type="button">Добавить</button>
          </div>
        </div>
      </section>
    </main>

    <footer id="contacts" class="site-footer">
      <div class="container">
        <p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
        <p>© 2025 Food FRYDAY. Все права защищены.</p>
      </div>
    </footer>
  </div>
</body>
</html>
