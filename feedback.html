<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Форма обратной связи Food FRYDAY — жалобы, предложения и вопросы по доставке.">
    <title>Food FRYDAY — Обратная связь</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="feedback.css">
    <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <div class="container">
                <h1>Food FRYDAY</h1>
                <nav class="main-nav">
                    <a href="index.html">О нас</a>
                    <a href="order.html">Сделать заказ</a>
                    <a href="index.html#contacts">Контакты</a>
                    <a href="auth.html">Авторизация</a>
                    <a href="feedback.html" class="active">Обратная связь</a>
                </nav>
            </div>
        </header>

        <main class="container form-page">
            <div class="feedback-form">
                <h2>Форма обратной связи</h2>
                <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="fio">ФИО</label>
                        <input type="text" id="fio" name="fio" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label>Откуда узнали о нас</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="source1" name="source" value="search" checked>
                                <label for="source1">Поисковые системы</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="source2" name="source" value="social">
                                <label for="source2">Социальные сети</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="source3" name="source" value="friends">
                                <label for="source3">От друзей</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="source4" name="source" value="other">
                                <label for="source4">Другое</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="type">Тип обращения</label>
                        <select id="type" name="type" required>
                            <option value="">Выберите тип</option>
                            <option value="complaint">Жалоба</option>
                            <option value="suggestion">Предложение</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Текст сообщения</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="attachment">Вложения</label>
                        <input type="file" id="attachment" name="attachment">
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="consent" name="consent" required>
                            <label for="consent">Даю согласие на обработку персональных данных</label>
                        </div>
                    </div>

                    <button type="submit">Отправить</button>
                </form>

                <div class="nav-links">
                    <a href="index.html">Главная</a>
                    <a href="auth.html">Вход</a>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
            </div>
        </footer>
    </div>
</body>
</html>
