<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: url('https://fons.grizly.club/uploads/posts/2025-06/04/17490288388202.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

      

        .form-container {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input[type="file"] {
            width: 100%;
            padding: 8px 0;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            margin: 0;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 3px;
        }

        .checkbox-group label {
            font-weight: normal;
            margin: 0;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #555;
        }

        .nav-links {
            text-align: center;
            margin-top: 20px;
        }

        .nav-links a {
            color: #333;
            text-decoration: none;
            margin: 0 10px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <div class="form-container">
        <h2>Форма обратной связи</h2>
        <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="fio">ФИО</label>
                <input type="text" id="fio" name="fio" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Откуда узнали о нас</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="source1" name="source" value="search" checked>
                        <label for="source1">Поисковые системы</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="source2" name="source" value="social">
                        <label for="source2">Социальные сети</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="source3" name="source" value="friends">
                        <label for="source3">От друзей</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="source4" name="source" value="other">
                        <label for="source4">Другое</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="type">Тип обращения</label>
                <select id="type" name="type" required>
                    <option value="">Выберите тип</option>
                    <option value="complaint">Жалоба</option>
                    <option value="suggestion">Предложение</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Текст сообщения</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <div class="form-group">
                <label for="attachment">Вложения</label>
                <input type="file" id="attachment" name="attachment">
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">Даю согласие на обработку персональных данных</label>
                </div>
            </div>

            <button type="submit">Отправить</button>
        </form>

        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="auth.html">Вход</a>
        </div>
    </div>
</body>
</html>
